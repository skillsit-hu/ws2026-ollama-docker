services:
  ollama:
    build:
      context: .
      dockerfile: Dockerfile
    image: ollama-with-ssh:local
    container_name: ollama
    restart: unless-stopped
    ports:
      - "0.0.0.0:11435:11434"
      - "0.0.0.0:2222:22"
    volumes:
      - ./ollama-data:/root/.ollama
      - ./authorized_keys:/ssh-keys/authorized_keys:ro
    environment:
      MODEL_NAME: ${MODEL_NAME}
      MODEL_ALIAS: ${MODEL_ALIAS}
      OLLAMA_CONTEXT_LENGTH: ${CONTEXT_LENGTH:-8192}
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_ORIGINS: "*"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
